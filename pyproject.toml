[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "opensiterm"
dynamic = ["version"]
description = "Serial port access for AI coding agents (Claude Code, Codex, opencode, oh-my-pi, DeepSeek...): a background serial session + CLI + MCP server + Agent Skill."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OpenSiTerm contributors" }]
keywords = ["serial", "uart", "com-port", "mcp", "ai-agent", "claude-code", "codex", "embedded",
            "hardware-debugging", "pyserial", "agent-skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: System :: Hardware",
  "Topic :: Terminals :: Serial",
]
dependencies = [
  "pyserial>=3.5",
  "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/aimachy/opensiterm"
Issues = "https://github.com/aimachy/opensiterm/issues"

[project.scripts]
opensiterm = "opensiterm.cli:main"

[tool.hatch.version]
path = "src/opensiterm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opensiterm"]

[tool.hatch.build.targets.wheel.force-include]
"skills/opensiterm/SKILL.md" = "opensiterm/_skill/SKILL.md"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "README*.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
